[general]
default_session_mode = "terminal"
restore_session = true
snackbar_enabled = true
link_tooltip = true
show_warning_before_quitting = true
quit_on_last_window_closed = false
login_item = true
show_changelog_after_update = true
mouse_scroll_multiplier = 3.0
should_confirm_close_session = true
new_tab_placement = "after_current_tab"

[general.undo_close]
enabled = true
grace_period = 60

[agents]

[agents.third_party]
should_render_cli_agent_toolbar = false

[agents.warp_agent]
is_any_ai_enabled = false

[agents.warp_agent.other]
show_agent_notifications = true
show_conversation_history = true
thinking_display_mode = "show_and_collapse"
open_conversation_layout_preference = "new_tab"

[code]

[code.editor]
open_file_editor = "env_editor"
open_code_panels_file_editor = "warp"
open_file_layout = "split_pane"
prefer_tabbed_editor_view = true
prefer_markdown_viewer = false
auto_open_code_review_pane_on_first_agent_change = false
show_code_review_button = true
show_project_explorer = true
show_global_search = true

[appearance]
spacing = "normal"

[appearance.themes]
system_theme = false
theme = "adeberry"

[appearance.text]
notebook_font_size = 14.0
font_size = 13.0
font_name = "Hack"
font_weight = "normal"
ai_font_name = "Hack"
match_ai_font = false
match_notebook_to_monospace_font_size = true
use_thin_strokes = "on_high_dpi_displays"
enforce_minimum_contrast = "only_named_colors"
ligature_rendering_enabled = false

[appearance.icon]
app_icon = "default"

[appearance.window]
open_windows_at_custom_size = false
override_opacity = 100
override_blur = 1
zoom_level = 100

[appearance.input]
input_mode = "pinned_to_bottom"

[appearance.panes]
should_dim_inactive_panes = false
focus_pane_on_hover = false

[appearance.blocks]
show_jump_to_bottom_of_block_button = true
show_block_dividers = true

[appearance.cursor]
cursor_display_type = "bar"
cursor_blink = "enabled"

[appearance.tabs]
show_indicators_button = true
workspace_decoration_visibility = "hide_fullscreen"
tab_close_button_position = "right"
preserve_active_tab_color = false

[appearance.vertical_tabs]
enabled = true
display_granularity = "panes"
show_panel_in_restored_windows = false
use_latest_prompt_as_title = false

[terminal]
maximum_grid_size = 50000
mouse_reporting_enabled = true
scroll_reporting_enabled = true
focus_reporting_enabled = true
use_audible_bell = false
copy_on_select = true
osc52_clipboard_access = "read_write"

[terminal.input]
input_box_type_setting = "universal"
honor_ps1 = false
error_underlining_enabled = true
syntax_highlighting = true
completions_open_while_typing = false
command_corrections = true
alias_expansion_enabled = false
middle_click_paste_enabled = true
at_context_menu_in_terminal_mode = true
outline_codebase_symbols_for_at_context_menu = true
show_terminal_input_message_bar = true

[terminal.input.extra_meta_keys]
left_alt = false
right_alt = false

[terminal.input.autosuggestions]
keybinding_hint = true
show_ignore_button = false

[terminal.smart_select]
enabled = true

[warp_drive]
enabled = false

[privacy]
telemetry_enabled = false
crash_reporting_enabled = false

[privacy.secret_redaction]
enabled = true
secret_display_mode_setting = "strikethrough"

[notifications]
toast_duration_secs = 8

[notifications.preferences]
is_agent_task_completed_enabled = true
is_long_running_enabled = true
is_needs_attention_enabled = true
is_password_prompt_enabled = true
long_running_threshold = 30
mode = "disabled"
play_notification_sound = true

[warpify]

[warpify.ssh]
enable_legacy_ssh_wrapper = true

[session]
new_session_shell_override = "system_default"

[session.working_directory_config]
advanced_mode = false
global = { custom_dir = "", mode = "previous_dir" }
new_tab = { custom_dir = "", mode = "previous_dir" }
new_window = { custom_dir = "", mode = "previous_dir" }
split_pane = { custom_dir = "", mode = "previous_dir" }

[keys]
ctrl_tab_behavior_setting = "activate_prev_next_tab"

[global_hotkey]

[global_hotkey.dedicated_window]
enabled = false

[global_hotkey.toggle_all_windows]
enabled = false

[text_editing]
autocomplete_symbols = true
vim_mode_enabled = false
vim_unnamed_system_clipboard = false
vim_status_bar = true

[workflows]
show_global_workflows_in_universal_search = false
