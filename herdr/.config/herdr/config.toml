onboarding = false

[theme]
name = "catppuccin"
auto_switch = false

[ui]
agent_panel_sort = "priority"

[keys]
# Pressed as right cmd+s: Ghostty sends ctrl+enter for it. herdr needs a real
# key after the modifiers (a bare "ctrl+alt" silently falls back to ctrl+b).
prefix = "ctrl+enter"

# Changed from herdr's defaults.
rename_tab = "prefix+t"
rename_workspace = "prefix+w"
workspace_picker = "prefix+shift+w"
help = ["prefix+?", "prefix+/"]
split_horizontal = "prefix+h"
last_pane = "prefix+space"

# Only the basics and our own keys stay bound.
settings = ""
open_notification_target = ""
goto = ""
new_workspace = ""
new_worktree = ""
close_workspace = ""
close_tab = ""
rename_pane = ""
edit_scrollback = ""
focus_pane_left = ""
focus_pane_down = ""
focus_pane_up = ""
focus_pane_right = ""
cycle_pane_next = ""
cycle_pane_previous = ""
close_pane = ""
zoom = ""
resize_mode = ""

# herdrctl and muxloc live in ~/.local/bin; full paths because herdr runs
# these without the login PATH.

[[keys.command]]
key = "prefix+a"
description = "jump to the next agent waiting on you"
type = "shell"
command = "$HOME/.local/bin/herdrctl next"

[[keys.command]]
key = "prefix+="
description = "new tab with the same agent and flags"
type = "shell"
command = "$HOME/.local/bin/herdrctl new-agent-tab"

[[keys.command]]
key = "prefix+m"
description = "move pane to another workspace"
type = "popup"
command = "$HOME/.local/bin/herdrctl mv"
width = "50%"
height = "40%"

[[keys.command]]
key = "prefix+shift+t"
description = "reset tab name (renamed on the agent's next reply)"
type = "shell"
command = "$HOME/.local/bin/muxloc reset-name"

[[keys.command]]
key = "prefix+i"
description = "copy this pane's id"
type = "shell"
command = "$HOME/.local/bin/herdrctl id --copy"
