# rebind the default tmux prefix key
# NOTE: this breaks several applications like nano but gives you the emacs feel in tmux :)
unbind C-b
set -g prefix C-x

# HACK: pressing ctrl+x twice sends a literal ctrl+x to the underlying program (since ctrl+x is now "consumed" by tmux)
bind C-x send-prefix

# status bar with a dark blue-gray background and off-white text (dracula variant)
set -g status-style bg=#252631,fg=#f8f8f2

# scrollback buffer holds 100k lines (default is 2000)
set -g history-limit 100000

# let tmux launch the login shell normally
set-option -g default-shell "$SHELL"

# enables osc 52 clipboard passthrough, useful for clipboard access over ssh/remote session
set -g set-clipboard on

# enable mouse for scrolling, pane selection, and text selection
set -g mouse on

# when you finish a mouse drag selection, copy it to clipboard and exit copy mode
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "command -v yui >/dev/null && yui copy || { command -v pbcopy >/dev/null && pbcopy || { command -v xclip >/dev/null && xclip -selection clipboard || echo 'No clipboard tool found (yui, pbcopy, xclip)' >&2; }; }"
